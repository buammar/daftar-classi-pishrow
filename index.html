<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>داشبورد مدیر دفتر کلاسی</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1>داشبورد مدیر</h1>
      <small id="connectionState">در حال آماده‌سازی…</small>
    </div>
    <button id="refreshBtn" class="ghost">↻ تازه‌سازی</button>
  </header>

  <section id="loginView" class="login-card">
    <h2>ورود مدیر</h2>
    <p>اتصال مستقیم به Google Sheets انجام می‌شود؛ اطلاعات دانش‌آموزان در GitHub ذخیره نمی‌شود.</p>
    <label>کد مدیر<input id="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="کد مدیر سیستم"></label>
    <button id="loginBtn" class="primary">ورود</button>
    <div id="loginError" class="error"></div>
  </section>

  <main id="mainView" hidden>
    <nav class="tabs">
      <button data-tab="dashboard" class="active">داشبورد</button>
      <button data-tab="monitoring">مانیتورینگ زنگ‌ها</button>
      <button data-tab="absences">مشاهده غیبت</button>
    </nav>

    <section id="dashboardTab" class="tab">
      <div class="stats" id="stats"></div>
      <div class="panel">
        <div class="panel-head"><h2>وضعیت امروز</h2><span id="todayText"></span></div>
        <div id="todayMonitoring" class="class-grid"></div>
      </div>
    </section>

    <section id="monitoringTab" class="tab" hidden>
      <div class="toolbar">
        <label>تاریخ شمسی
          <input id="monitorDate" placeholder="مثال: 1405/07/12">
          <small id="monitorWeekday" class="weekday-label"></small>
        </label>
        <label>نمایش
          <select id="monitorFilter">
            <option value="all">همه</option>
            <option value="recorded">فقط ثبت شده‌ها</option>
            <option value="unrecorded">فقط ثبت نشده‌ها</option>
            <option value="ambiguous">نیاز به تطبیق</option>
          </select>
        </label>
        <button id="monitorBtn" class="primary">نمایش</button>
      </div>
      <div id="monitorSummary" class="notice"></div>
      <div id="monitorGrid" class="class-grid"></div>
    </section>

    <section id="absencesTab" class="tab" hidden>
      <div class="toolbar">
        <label>تاریخ شمسی
          <input id="absenceDate" placeholder="مثال: 1405/07/12">
          <small id="absenceWeekday" class="weekday-label"></small>
        </label>
        <label>کلاس<select id="classSelect"></select></label>
        <label>زنگ<select id="periodSelect"><option value="">همه زنگ‌ها</option></select></label>
        <button id="absenceBtn" class="primary">مشاهده</button>
      </div>
      <div id="absenceResult"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
